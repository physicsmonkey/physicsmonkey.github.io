<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$title$ — Brian Swingle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
  <script>
    window.addEventListener("load", function () {
      document.querySelectorAll(".math").forEach(function (el) {
        try {
          katex.render(el.textContent, el, {
            throwOnError: false,
            displayMode: el.classList.contains("display"),
          });
        } catch (e) { console.error(e); }
      });
    });
  </script>
  $header-includes$
</head>
<body>

  <nav id="nav">
    <div class="container nav-inner">
      <a href="javascript:history.back()" class="nav-name">← Back</a>
      <ul class="nav-links">
        <li><a href="/index.html">Home</a></li>
        <li><a href="/journal.html">Journal</a></li>
      </ul>
    </div>
  </nav>

  <section id="post-body" style="padding-top: 56px;">
    <div class="container">
      <div class="post-content">
        <h1 style="font-size:1.6rem; margin-bottom: 1.2em;">$title$</h1>
        $body$
      </div>
      <div class="post-footer">
        <a href="javascript:history.back()" class="btn btn-outline">← Back</a>
      </div>
    </div>
  </section>

  <footer>
    <div class="container footer-inner">
      <p class="footer-name">Brian Swingle</p>
      <div class="footer-links">
        <a href="/index.html">Home</a>
        <a href="/journal.html">Journal</a>
      </div>
    </div>
  </footer>

  <script>
  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 20);
  }, { passive: true });
  </script>

</body>
</html>
